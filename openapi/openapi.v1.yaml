components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        data:
          nullable: true
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
        error:
          type: object
          required:
            - code
            - message
            - traceId
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
            traceId:
              type: string
    ContractType:
      type: string
      enum:
        - SALE
        - SALE_CASH
        - SALE_FINANCED
        - SALE_TRADE
        - SALE_INSTALLMENTS
        - LEASE
        - LEASE_RESIDENTIAL
        - LEASE_COMMERCIAL
        - LEASE_SEASONAL
        - PROPERTY_ADMIN
        - SERVICE
        - CONSTRUCTION
      x-closed: true
      description: Os 12 tipos de contrato (JUR-003).
