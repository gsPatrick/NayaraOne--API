components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    clientCredentials:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/api-external/oauth/token
          scopes:
            properties:read: Consultar os imóveis publicados da empresa.
            leads:write: Enviar um lead para o funil comercial.
            contracts:read: Consultar contratos (dados resumidos).
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
        data:
          nullable: true
        pagination:
          $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      required:
        - page
        - pageSize
        - total
        - totalPages
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ErrorEnvelope:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
        error:
          type: object
          required:
            - code
            - message
            - traceId
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
            traceId:
              type: string
    ContractType:
      type: string
      enum:
        - SALE
        - SALE_CASH
        - SALE_FINANCED
        - SALE_TRADE
        - SALE_INSTALLMENTS
        - LEASE
        - LEASE_RESIDENTIAL
        - LEASE_COMMERCIAL
        - LEASE_SEASONAL
        - PROPERTY_ADMIN
        - SERVICE
        - CONSTRUCTION
      x-closed: true
      description: Os 12 tipos de contrato (JUR-003).
    TokenRequest:
      type: object
      required:
        - grant_type
        - client_id
        - client_secret
      properties:
        grant_type:
          type: string
          enum:
            - client_credentials
        client_id:
          type: string
        client_secret:
          type: string
        scope:
          type: string
          description: Scopes separados por espaço (RFC 6749). Sem o campo, vale tudo que a credencial tem.
    TokenResponse:
      type: object
      required:
        - access_token
        - token_type
        - expires_in
        - scope
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
            - Bearer
        expires_in:
          type: integer
        scope:
          type: string
  headers:
    XCorrelationId:
      description: Identificador da requisição; igual a error.traceId nas respostas de erro.
      required: true
      schema:
        type: string
    XRateLimitLimit:
      description: Limite de requisições por janela de 60 s (M9-D843).
      required: false
      schema:
        type: integer
    XRateLimitRemaining:
      description: Requisições restantes na janela.
      required: false
      schema:
        type: integer
    XRateLimitReset:
      description: Segundos até a janela reiniciar.
      required: false
      schema:
        type: integer
    Deprecation:
      description: 'Rota deprecada (M9-D841): @<epoch do anúncio>.'
      required: false
      schema:
        type: string
    Sunset:
      description: Data HTTP do desligamento da rota deprecada.
      required: false
      schema:
        type: string
