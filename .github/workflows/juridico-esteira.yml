name: Esteira do juridico

# Guia do Marco 5, §17 (CI/CD): lint, typecheck, migrations, contract_state_tests, requirements_tests, signature_adapter_contract_tests, signature_webhook_idempotency_tests,
# inspection_immutability_tests, key_delivery_gate_tests, deadline_tests, evidence_integrity_tests, multi_company_tests, security_scan, deploy_DEV, deploy_LAB, failure_drills, pentest e
# production_approval, NESTA ORDEM, num unico processo (scripts/ci-juridico/executar.js; etapas.js recusa outra ordem ou outro nome), parando na primeira etapa vermelha.
# Todo push e pull request roda as 18 etapas (DI-M5ES-1): deploy_DEV e deploy_LAB publicam o artefato do commit e fazem o smoke do juridico no proprio job; failure_drills roda o
# drill de restore completo; production_approval e o PORTAO de producao (bloqueia sem restore verde, sem pentest verde, com falha aberta ou etapa anterior nao verde).
# Em tag jur-release-*: a mesma esteira com --release (deploy_DEV e deploy_LAB tambem disparam o hook do servidor DEV/LAB e conferem o commit em /api/version) e, depois do portao
# liberado, o job aprovacao-producao aguarda a aprovacao humana do environment "juridico-aprovacao" (revisor obrigatorio: o Patrick). O CI NAO faz deploy em producao.
# Banco: sempre o cluster descartavel (scripts/withDisposableDb.js). Relatorio e evidencias ficam fora do repositorio (runner.temp) e sao arquivados.
on:
  push:
    branches: [main, marco-6-e-7-homologado-nayara, marco-9]
    tags: ['jur-release-*']
  pull_request:
  workflow_dispatch:

jobs:
  esteira-juridico:
    # Push e pull request (fora de tag): as 18 etapas, na ordem do livro.
    if: ${{ !startsWith(github.ref, 'refs/tags/jur-release-') }}
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI_TENANT_USERS_PASSWORD: ci-tenant-users-password-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: PostgreSQL 17 (binarios para os clusters descartaveis da esteira e do drill de restore)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
          echo "DRILL_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Etapas 1 a 18 do Guia M5 §17 (para na primeira vermelha; a 18 e o portao de producao)
        run: bash scripts/ci-estagios-juridico.sh "${{ runner.temp }}/esteira-juridico/esteira-juridico.json"
      - name: Arquivar o relatorio por etapa e as evidencias (testes, restore, pentest, deploy local, portao)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esteira-juridico-${{ github.sha }}
          path: ${{ runner.temp }}/esteira-juridico/
          if-no-files-found: error
          retention-days: 90

  esteira-juridico-release:
    # Tag jur-release-*: as mesmas 18 etapas, na mesma ordem, com --release (deploy_DEV/deploy_LAB tambem no servidor do Patrick via hook).
    if: ${{ startsWith(github.ref, 'refs/tags/jur-release-') }}
    runs-on: ubuntu-latest
    environment: lab
    env:
      NODE_ENV: test
      CI_TENANT_USERS_PASSWORD: ci-tenant-users-password-not-for-production
      JUR_CI_DEV_DEPLOY_HOOK: ${{ secrets.DEV_API_DEPLOY_HOOK_URL }}
      JUR_CI_DEV_URL: ${{ secrets.DEV_API_URL }}
      JUR_CI_LAB_DEPLOY_HOOK: ${{ secrets.LAB_API_DEPLOY_HOOK_URL }}
      JUR_CI_LAB_URL: ${{ secrets.LAB_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: PostgreSQL 17 (binarios para os clusters descartaveis da esteira e do drill de restore)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
          echo "DRILL_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Etapas 1 a 18 do Guia M5 §17 com --release (a 18 e o portao de producao)
        run: bash scripts/ci-estagios-juridico.sh "${{ runner.temp }}/esteira-juridico/esteira-juridico.json" --release
      - name: Arquivar o relatorio por etapa e as evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esteira-juridico-release-${{ github.sha }}
          path: ${{ runner.temp }}/esteira-juridico/
          if-no-files-found: error
          retention-days: 365

  aprovacao-producao:
    # Etapa 18 (production_approval), parte humana: so depois da esteira de release verde (portao liberado). O environment tem revisor obrigatorio.
    # Este job NAO faz deploy: confere de novo o portao sobre as evidencias arquivadas e registra a aprovacao.
    if: ${{ startsWith(github.ref, 'refs/tags/jur-release-') }}
    needs: esteira-juridico-release
    runs-on: ubuntu-latest
    environment: juridico-aprovacao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/download-artifact@v4
        with:
          name: esteira-juridico-release-${{ github.sha }}
          path: ${{ runner.temp }}/esteira-juridico
      - name: Portao de producao conferido de novo sobre as evidencias da release (restore, pentest, falhas, etapas 1-17)
        run: node scripts/ci-juridico/gateProducao.js --relatorio "${{ runner.temp }}/esteira-juridico/esteira-juridico.json" --evidencias "${{ runner.temp }}/esteira-juridico/esteira-juridico-evidencias" --commit "${{ github.sha }}"
