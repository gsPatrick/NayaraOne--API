name: Esteira do juridico

# Guia do Marco 5, §17 (CI/CD): lint, typecheck, migrations, contract_state_tests, requirements_tests, signature_adapter_contract_tests, signature_webhook_idempotency_tests,
# inspection_immutability_tests, key_delivery_gate_tests, deadline_tests, evidence_integrity_tests, multi_company_tests, security_scan, deploy_DEV, deploy_LAB, failure_drills, pentest e
# production_approval, nesta ordem (scripts/ci-juridico/etapas.js recusa outra ordem ou outro nome), parando na primeira etapa vermelha. Todo push e pull request roda as etapas de código e
# banco; deploy_DEV, deploy_LAB e production_approval só em tag jur-release-* (fora dela saem NAO_APLICAVEL, ditas no relatório). Banco: sempre o cluster descartável
# (scripts/withDisposableDb.js). O CI NÃO faz deploy em produção: production_approval só aguarda a aprovação do environment "juridico-aprovacao" (revisor obrigatório: o Patrick).
on:
  push:
    branches: [main, marco-6-e-7-homologado-nayara, marco-9]
    tags: ['jur-release-*']
  pull_request:
  workflow_dispatch:

jobs:
  esteira-juridico:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI_TENANT_USERS_PASSWORD: ci-tenant-users-password-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: PostgreSQL 17 (binarios para o cluster descartavel)
        run: |
          sudo apt-get update -y && sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17
          echo "DRILL_PG_BIN=/usr/lib/postgresql/17/bin" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Etapas 1 a 17 (param na primeira vermelha; as de release saem NAO_APLICAVEL fora da tag)
        run: bash scripts/ci-estagios-juridico.sh docs/evidencias/ci/esteira-juridico.json --ate 17
      - name: Arquivar o relatorio por etapa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esteira-juridico-${{ github.sha }}
          path: docs/evidencias/ci/esteira-juridico*.json
          if-no-files-found: warn
          retention-days: 90

  release-juridico:
    # Tag jur-release-*: deploy_DEV e deploy_LAB (hook do environment + conferencia do commit em /api/version).
    if: ${{ startsWith(github.ref, 'refs/tags/jur-release-') }}
    needs: esteira-juridico
    runs-on: ubuntu-latest
    environment: lab
    env:
      JUR_CI_DEV_DEPLOY_HOOK: ${{ secrets.DEV_API_DEPLOY_HOOK_URL }}
      JUR_CI_DEV_URL: ${{ secrets.DEV_API_URL }}
      JUR_CI_LAB_DEPLOY_HOOK: ${{ secrets.LAB_API_DEPLOY_HOOK_URL }}
      JUR_CI_LAB_URL: ${{ secrets.LAB_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Etapas 14 e 15 (deploy_DEV e deploy_LAB)
        run: node scripts/ci-juridico/executar.js --release --de 14 --ate 15 --relatorio docs/evidencias/ci/esteira-juridico-release.json

  aprovacao-juridico:
    # Etapa 18 (production_approval): o environment tem revisor obrigatorio. Este job NAO executa deploy; registra AGUARDANDO_APROVACAO.
    if: ${{ startsWith(github.ref, 'refs/tags/jur-release-') }}
    needs: release-juridico
    runs-on: ubuntu-latest
    environment: juridico-aprovacao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Etapa 18 (production_approval, aguarda a pessoa)
        run: node scripts/ci-juridico/executar.js --release --de 18 --ate 18 --relatorio docs/evidencias/ci/esteira-juridico-aprovacao.json
