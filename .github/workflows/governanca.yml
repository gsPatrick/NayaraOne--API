name: Governanca

# M9-D890 (Guia §8, Testes/CI do bloco de governança): oito verificações obrigatórias, uma por job, mais o job de regressão da matriz AUD-013 a AUD-020 (M9-D809, nono job, que não é
# controle do Guia §8) e o job do mapa dos 10 testes adversariais do livro (scripts/checkAdversarialMap.js). Todos chamam scripts/ci-governanca.sh <controle>, o mesmo comando de quem
# desenvolve. Nenhum job tolera falha: nenhum controle é desligado sem aparecer no run. Os testes com banco rodam no cluster PostgreSQL DESCARTÁVEL (scripts/withDisposableDb.js),
# nunca no banco compartilhado, e nenhum teste pode ficar pulado nele. JUnit e resumo de cada job saem como artefato. O CI não faz push nem deploy.
on:
  push:
    branches: [main, marco-6-e-7-homologado-nayara, marco-9]
  pull_request:
  workflow_dispatch:

jobs:
  calendar-idempotency:
    name: Calendar idempotency (D801 a D803)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      CI_TENANT_USERS_PASSWORD: ci-tenant-users-password-not-for-production
    services:
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Calendar idempotency (D801 a D803)
        run: bash scripts/ci-governanca.sh calendar
      - name: Publicar JUnit e resumo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governanca-calendar-idempotency-${{ github.sha }}
          path: docs/evidencias/ci/governanca
          if-no-files-found: warn
          retention-days: 90

